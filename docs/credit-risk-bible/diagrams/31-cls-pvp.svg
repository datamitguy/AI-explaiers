 viewBox="0.00 0.00 471.80 675.80" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(14.4 661.4)">
<title>CLS</title>
<polygon fill="white" stroke="transparent" points="-14.4,14.4 -14.4,-661.4 457.4,-661.4 457.4,14.4 -14.4,14.4"/>
<g id="node1" class="node">
<title>Trade</title>
<path fill="#1f2937" stroke="#1f2937" d="M398.5,-647C398.5,-647 151.5,-647 151.5,-647 145.5,-647 139.5,-641 139.5,-635 139.5,-635 139.5,-621 139.5,-621 139.5,-615 145.5,-609 151.5,-609 151.5,-609 398.5,-609 398.5,-609 404.5,-609 410.5,-615 410.5,-621 410.5,-621 410.5,-635 410.5,-635 410.5,-641 404.5,-647 398.5,-647"/>
<text text-anchor="middle" x="275" y="-631.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">Bank A and Bank B agree an FX trade</text>
<text text-anchor="middle" x="275" y="-618.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">A sells 10m pounds, B sells 12.5m dollars</text>
</g>
<g id="node2" class="node">
<title>Submit</title>
<path fill="#eef2ff" stroke="#6366f1" d="M366.5,-578C366.5,-578 183.5,-578 183.5,-578 177.5,-578 171.5,-572 171.5,-566 171.5,-566 171.5,-552 171.5,-552 171.5,-546 177.5,-540 183.5,-540 183.5,-540 366.5,-540 366.5,-540 372.5,-540 378.5,-546 378.5,-552 378.5,-552 378.5,-566 378.5,-566 378.5,-572 372.5,-578 366.5,-578"/>
<text text-anchor="middle" x="275" y="-562.4" font-family="Helvetica,sans-Serif" font-size="12.00">1. Both banks send settlement</text>
<text text-anchor="middle" x="275" y="-549.4" font-family="Helvetica,sans-Serif" font-size="12.00">instructions to CLS</text>
</g>
<g id="edge1" class="edge">
<title>Trade&#45;&gt;Submit</title>
<path fill="none" stroke="#4b5563" d="M275,-608.69C275,-601.6 275,-593.36 275,-585.69"/>
<polygon fill="#4b5563" stroke="#4b5563" points="277.45,-585.29 275,-578.29 272.55,-585.29 277.45,-585.29"/>
</g>
<g id="node3" class="node">
<title>Match</title>
<path fill="#eef2ff" stroke="#6366f1" d="M392.5,-509C392.5,-509 157.5,-509 157.5,-509 151.5,-509 145.5,-503 145.5,-497 145.5,-497 145.5,-483 145.5,-483 145.5,-477 151.5,-471 157.5,-471 157.5,-471 392.5,-471 392.5,-471 398.5,-471 404.5,-477 404.5,-483 404.5,-483 404.5,-497 404.5,-497 404.5,-503 398.5,-509 392.5,-509"/>
<text text-anchor="middle" x="275" y="-493.4" font-family="Helvetica,sans-Serif" font-size="12.00">2. CLS matches the two instructions</text>
<text text-anchor="middle" x="275" y="-480.4" font-family="Helvetica,sans-Serif" font-size="12.00">and queues the trade for its value date</text>
</g>
<g id="edge2" class="edge">
<title>Submit&#45;&gt;Match</title>
<path fill="none" stroke="#4b5563" d="M275,-539.69C275,-532.6 275,-524.36 275,-516.69"/>
<polygon fill="#4b5563" stroke="#4b5563" points="277.45,-516.29 275,-509.29 272.55,-516.29 277.45,-516.29"/>
</g>
<g id="node4" class="node">
<title>Net</title>
<path fill="#eef2ff" stroke="#6366f1" d="M403,-440C403,-440 147,-440 147,-440 141,-440 135,-434 135,-428 135,-428 135,-401 135,-401 135,-395 141,-389 147,-389 147,-389 403,-389 403,-389 409,-389 415,-395 415,-401 415,-401 415,-428 415,-428 415,-434 409,-440 403,-440"/>
<text text-anchor="middle" x="275" y="-424.4" font-family="Helvetica,sans-Serif" font-size="12.00">3. Before value date CLS nets each</text>
<text text-anchor="middle" x="275" y="-411.4" font-family="Helvetica,sans-Serif" font-size="12.00">member&#39;s trades per currency and sends</text>
<text text-anchor="middle" x="275" y="-398.4" font-family="Helvetica,sans-Serif" font-size="12.00">a pay&#45;in schedule (much smaller amounts)</text>
</g>
<g id="edge3" class="edge">
<title>Match&#45;&gt;Net</title>
<path fill="none" stroke="#4b5563" d="M275,-470.83C275,-463.74 275,-455.39 275,-447.36"/>
<polygon fill="#4b5563" stroke="#4b5563" points="277.45,-447.11 275,-440.11 272.55,-447.11 277.45,-447.11"/>
</g>
<g id="node5" class="node">
<title>PayIn</title>
<path fill="#eef2ff" stroke="#6366f1" d="M400.5,-358C400.5,-358 149.5,-358 149.5,-358 143.5,-358 137.5,-352 137.5,-346 137.5,-346 137.5,-319 137.5,-319 137.5,-313 143.5,-307 149.5,-307 149.5,-307 400.5,-307 400.5,-307 406.5,-307 412.5,-313 412.5,-319 412.5,-319 412.5,-346 412.5,-346 412.5,-352 406.5,-358 400.5,-358"/>
<text text-anchor="middle" x="275" y="-342.4" font-family="Helvetica,sans-Serif" font-size="12.00">4. On value date members pay in through</text>
<text text-anchor="middle" x="275" y="-329.4" font-family="Helvetica,sans-Serif" font-size="12.00">central bank payment systems,</text>
<text text-anchor="middle" x="275" y="-316.4" font-family="Helvetica,sans-Serif" font-size="12.00">in a window when all are open</text>
</g>
<g id="edge4" class="edge">
<title>Net&#45;&gt;PayIn</title>
<path fill="none" stroke="#4b5563" d="M275,-388.63C275,-381.18 275,-372.92 275,-365.1"/>
<polygon fill="#4b5563" stroke="#4b5563" points="277.45,-365.08 275,-358.08 272.55,-365.08 277.45,-365.08"/>
</g>

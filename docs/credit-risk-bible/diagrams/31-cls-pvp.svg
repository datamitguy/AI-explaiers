<text text-anchor="middle" x="106" y="-28.9" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">6. CLS pays out the net</text>
<text text-anchor="middle" x="106" y="-15.9" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">balances to members</text>
</g>

<path fill="none" stroke="#4b5563" d="M266.88,-177.06C267.13,-166.97 269.05,-156.72 274,-148 277.83,-141.24 283.33,-135.51 289.54,-130.7"/>
<polygon fill="#4b5563" stroke="#4b5563" points="291.13,-132.58 295.42,-126.53 288.29,-128.58 291.13,-132.58"/>
<text text-anchor="middle" x="291.5" y="-151" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#374151">not yet</text>
</g>
<g id="node10" class="node">

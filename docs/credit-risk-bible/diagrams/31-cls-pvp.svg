<path fill="#065f46" stroke="#065f46" d="M200,-133C200,-133 12,-133 12,-133 6,-133 0,-127 0,-121 0,-121 0,-94 0,-94 0,-88 6,-82 12,-82 12,-82 200,-82 200,-82 206,-82 212,-88 212,-94 212,-94 212,-121 212,-121 212,-127 206,-133 200,-133"/>
<text text-anchor="middle" x="106" y="-117.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">5. CLS settles both legs at once</text>
<text text-anchor="middle" x="106" y="-104.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">on its own books: pounds to B,</text>
<text text-anchor="middle" x="106" y="-91.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">dollars to A, in one instant</text>
</g>
<g id="edge6" class="edge">
<title>Q&#45;&gt;Settle</title>
<path fill="none" stroke="#4b5563" d="M228.82,-192.44C203.49,-175.13 172.32,-153.83 147.73,-137.02"/>
<polygon fill="#4b5563" stroke="#4b5563" points="149.11,-134.99 141.94,-133.07 146.34,-139.04 149.11,-134.99"/>
<text text-anchor="middle" x="185" y="-151" font-family="Helvetica,sans-Serif" font-size="10.00" fill="#374151">yes</text>
</g>
<g id="node8" class="node">
<title>Wait</title>
<path fill="#6b7280" stroke="#6b7280" d="M431,-126.5C431,-126.5 249,-126.5 249,-126.5 243,-126.5 237,-120.5 237,-114.5 237,-114.5 237,-100.5 237,-100.5 237,-94.5 243,-88.5 249,-88.5 249,-88.5 431,-88.5 431,-88.5 437,-88.5 443,-94.5 443,-100.5 443,-100.5 443,-114.5 443,-114.5 443,-120.5 437,-126.5 431,-126.5"/>
<text text-anchor="middle" x="340" y="-110.9" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">Trade waits in the queue</text>
<text text-anchor="middle" x="340" y="-97.9" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">nobody has lost a principal leg</text>
</g>
<g id="edge7" class="edge">

<text text-anchor="middle" x="275" y="-234.9" font-family="Helvetica,sans-Serif" font-size="12.00">Both legs funded</text>
<text text-anchor="middle" x="275" y="-221.9" font-family="Helvetica,sans-Serif" font-size="12.00">and risk tests</text>
<text text-anchor="middle" x="275" y="-208.9" font-family="Helvetica,sans-Serif" font-size="12.00">passed?</text>
</g>
<g id="edge5" class="edge">
<title>PayIn&#45;&gt;Q</title>
<path fill="none" stroke="#4b5563" d="M275,-306.76C275,-299.77 275,-291.85 275,-283.77"/>
<polygon fill="#4b5563" stroke="#4b5563" points="277.45,-283.33 275,-276.33 272.55,-283.33 277.45,-283.33"/>
</g>

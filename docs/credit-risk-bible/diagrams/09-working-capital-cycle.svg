<text text-anchor="middle" x="267" y="-165.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">Cash conversion cycle</text>
<text text-anchor="middle" x="267" y="-152.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">= stock days + debtor days &#45; creditor days</text>
<text text-anchor="middle" x="267" y="-139.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">= 60 + 45 &#45; 32 = 73 days</text>
<text text-anchor="middle" x="267" y="-126.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">that must be funded by the bank or by equity</text>
</g>

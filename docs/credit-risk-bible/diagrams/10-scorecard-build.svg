<text text-anchor="middle" x="318" y="-552.4" font-family="Helvetica,sans-Serif" font-size="12.00">(information value, correlation,</text>
<text text-anchor="middle" x="318" y="-539.4" font-family="Helvetica,sans-Serif" font-size="12.00">business sense, stability over time)</text>
</g>

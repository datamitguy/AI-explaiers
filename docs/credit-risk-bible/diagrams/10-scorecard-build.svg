<g id="node1" class="node">
<title>S1</title>
<path fill="#1f2937" stroke="#1f2937" d="M571.5,-918C571.5,-918 264.5,-918 264.5,-918 258.5,-918 252.5,-912 252.5,-906 252.5,-906 252.5,-877 252.5,-877 252.5,-871 258.5,-865 264.5,-865 264.5,-865 571.5,-865 571.5,-865 577.5,-865 583.5,-871 583.5,-877 583.5,-877 583.5,-906 583.5,-906 583.5,-912 577.5,-918 571.5,-918"/>
<text text-anchor="middle" x="418" y="-901.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">1. Define the target</text>
<text text-anchor="middle" x="418" y="-888.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">(e.g. 90 days past due within 12 months = bad)</text>
<text text-anchor="middle" x="418" y="-875.4" font-family="Helvetica,sans-Serif" font-size="12.00" fill="white">and the observation and performance windows</text>
</g>
<g id="node2" class="node">
<title>S2</title>
<path fill="#eef2ff" stroke="#6366f1" d="M571.5,-834C571.5,-834 264.5,-834 264.5,-834 258.5,-834 252.5,-828 252.5,-822 252.5,-822 252.5,-793 252.5,-793 252.5,-787 258.5,-781 264.5,-781 264.5,-781 571.5,-781 571.5,-781 577.5,-781 583.5,-787 583.5,-793 583.5,-793 583.5,-822 583.5,-822 583.5,-828 577.5,-834 571.5,-834"/>
<text text-anchor="middle" x="418" y="-817.4" font-family="Helvetica,sans-Serif" font-size="12.00">2. Assemble the sample</text>
<text text-anchor="middle" x="418" y="-804.4" font-family="Helvetica,sans-Serif" font-size="12.00">(e.g. 200,000 loans booked 2019 to 2022,</text>
<text text-anchor="middle" x="418" y="-791.4" font-family="Helvetica,sans-Serif" font-size="12.00">6,000 bads; exclusions and reject inference)</text>
</g>

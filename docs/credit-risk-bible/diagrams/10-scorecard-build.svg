<text text-anchor="middle" x="418" y="-733.4" font-family="Helvetica,sans-Serif" font-size="12.00">3. Candidate variables</text>
<text text-anchor="middle" x="418" y="-720.4" font-family="Helvetica,sans-Serif" font-size="12.00">(income, age of account, bureau score,</text>
<text text-anchor="middle" x="418" y="-707.4" font-family="Helvetica,sans-Serif" font-size="12.00">utilisation, missed payments, employment)</text>
</g>

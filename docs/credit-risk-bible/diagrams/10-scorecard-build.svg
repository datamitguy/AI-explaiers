<text text-anchor="middle" x="318" y="-649.4" font-family="Helvetica,sans-Serif" font-size="12.00">4. Binning and weight of evidence</text>
<text text-anchor="middle" x="318" y="-636.4" font-family="Helvetica,sans-Serif" font-size="12.00">(group each variable into bands,</text>
<text text-anchor="middle" x="318" y="-623.4" font-family="Helvetica,sans-Serif" font-size="12.00">compute log of good/bad odds per band)</text>
</g>
